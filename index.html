<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite</title>

<style>
body {
  margin:0;
  overflow:hidden;
  background:#ffe4ec;
  text-align:center;
  font-family:Arial;
}

#balloon {
  width:100px;
  height:120px;
  background:red;
  border-radius:50%;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(0);
  transition:3s;
  overflow:hidden;
}

#balloon img {
  width:100%;
  height:100%;
  opacity:0;
  transition:2s;
}

#text {
  position:absolute;
  top:10%;
  width:100%;
  font-size:40px;
  opacity:0;
  transition:2s;
}

button {
  padding:10px 20px;
  font-size:18px;
  margin:10px;
}

#no {
  position:absolute;
}
</style>
</head>
<body>

<div id="balloon">
  <img id="foto" src="https://via.placeholder.com/300">
</div>

<div id="text">Quer ser meu madrinho?</div>

<div style="position:absolute; bottom:50px; width:100%;">
  <button onclick="sim()">Sim</button>
  <button id="no">Não</button>
</div>

<script>
window.onload = function(){

setTimeout(()=>{
  let b = document.getElementById("balloon");
  b.style.transform = "translate(-50%,-50%) scale(3)";
  document.getElementById("foto").style.opacity = 1;
},500);

setTimeout(()=>{
  document.getElementById("text").style.opacity = 1;
},3500);

let no = document.getElementById("no");

no.onmouseover = ()=>{
  no.style.left = Math.random()*window.innerWidth + "px";
  no.style.top = Math.random()*window.innerHeight + "px";
}

window.sim = function(){
  alert("Você não tem escolha 😌");
}

}
</script>

</body>
</html>
