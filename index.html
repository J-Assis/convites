<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emanuel e Julya - Nosso Amor Eterno</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- ESTILOS GERAIS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Dancing Script', cursive;
        }

        body {
            background-color: #0b0208;
            color: #fff0f5;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, #4a0e35 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, #290725 0%, #0b0208 60%);
            background-attachment: fixed;
            position: relative;
        }

        /* --- ANIMAÇÃO DE CORAÇÕES CAINDO --- */
        .heart-fall {
            position: fixed;
            top: -10%;
            color: rgba(255, 77, 148, 0.4);
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                top: -10%;
                transform: translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                top: 110%;
                transform: translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* --- TOPO --- */
        header {
            text-align: center;
            padding: 80px 20px 30px 20px;
            position: relative;
            z-index: 2;
        }

        .heart-icon {
            font-size: 70px;
            color: #ff4d94;
            display: inline-block;
            text-shadow: 0 0 25px rgba(255, 77, 148, 0.8);
            animation: pulse 1.4s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px #ff4d94); }
            50% { transform: scale(1.2); filter: drop-shadow(0 0 20px #ff4d94); }
            100% { transform: scale(1); filter: drop-shadow(0 0 2px #ff4d94); }
        }

        h1 {
            font-size: 4.5rem;
            margin-top: 10px;
            background: linear-gradient(45deg, #ffffff, #ff99cc, #ff4d94);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        .sub-date {
            font-size: 1.6rem;
            color: #ffb3d9;
            margin-top: 15px;
            word-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        main {
            position: relative;
            z-index: 2;
        }

        /* --- CONTADOR --- */
        .counter-container {
            max-width: 650px;
            margin: 20px auto;
            text-align: center;
            padding: 0 20px;
        }

        .main-units {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 25px;
        }

        .unit {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 77, 148, 0.2);
            border-radius: 24px;
            padding: 20px;
            flex: 1;
            max-width: 160px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 77, 148, 0.1);
            transition: all 0.4s ease;
        }

        .unit:hover {
            transform: translateY(-8px) scale(1.05);
            border-color: rgba(255, 77, 148, 0.6);
            box-shadow: 0 20px 40px rgba(255, 77, 148, 0.2);
        }

        .unit-number {
            font-size: 4rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .unit-label {
            font-size: 1.4rem;
            color: #ff99cc;
        }

        .time-ticker {
            font-size: 2.5rem;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: inline-block;
            padding: 10px 40px;
            border-radius: 50px;
            margin-bottom: 25px;
            border: 2px solid rgba(255, 77, 148, 0.15);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-shadow: 0 0 10px rgba(255,255,255,0.4);
        }

        .total-days {
            font-size: 1.8rem;
            color: #ffb3d9;
        }
        
        .total-days strong {
            color: #ffffff;
            font-size: 2.2rem;
            margin: 0 6px;
            text-shadow: 0 0 10px rgba(255, 77, 148, 0.5);
        }

        /* --- TEXTO ROMÂNTICO --- */
        .love-letter {
            max-width: 650px;
            margin: 60px auto;
            padding: 40px 30px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 30px;
            text-align: center;
            border: 2px solid rgba(255, 77, 148, 0.25);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .love-letter p {
            font-size: 1.7rem;
            line-height: 1.7;
            color: #ffe6f2;
        }

        /* --- CARROSSEL DE FOTOS --- */
        .section-title {
            text-align: center;
            font-size: 3.8rem;
            margin: 80px 0 5px 0;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 77, 148, 0.3);
        }

        .section-subtitle {
            text-align: center;
            font-size: 1.4rem;
            color: #ff99cc;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .carousel-container {
            max-width: 450px;
            aspect-ratio: 4 / 5;
            margin: 0 auto;
            position: relative;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            border: 2px solid rgba(255, 77, 148, 0.3);
        }

        .carousel-track {
            display: flex;
            height: 100%;
            transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .carousel-slide {
            min-width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(11, 2, 8, 0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 24px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .carousel-btn:hover {
            background: #ff4d94
